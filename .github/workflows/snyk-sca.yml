name: DevSecOps Snyk SCA

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate Lockfile
        run: npm i --package-lock-only || true

      - name: Snyk SCA Scan (Docker Container)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --command=install

      - name: Snyk Monitor
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
        if: github.ref == 'refs/heads/master'
